[project]
name = "safepath-rl-summative"
version = "0.1.0"
description = "SafePath: comparing DQN, REINFORCE, PPO and A2C (TorchRL) on a survivor-support navigation environment"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.3",
    "torchrl",
    "tensordict",
    "gymnasium>=0.29",
    "numpy",
    "pygame",
    "PyOpenGL",
    "matplotlib",
    "pandas",
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
